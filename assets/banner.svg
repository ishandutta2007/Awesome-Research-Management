<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="75%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.15); }
    }
    @keyframes floatSlow1 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(12px, -15px); }
    }
    @keyframes floatSlow2 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-15px, 12px); }
    }
    @keyframes orbitSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -100; }
    }
    @keyframes beamSweep {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .pulse-glow-1 {
      transform-origin: 250px 180px;
      animation: pulseGlow 7s ease-in-out infinite;
    }
    .pulse-glow-2 {
      transform-origin: 950px 220px;
      animation: pulseGlow 9s ease-in-out infinite 2s;
    }
    .floating-node-1 {
      animation: floatSlow1 6s ease-in-out infinite;
    }
    .floating-node-2 {
      animation: floatSlow2 8s ease-in-out infinite 1s;
    }
    .floating-node-3 {
      animation: floatSlow1 7s ease-in-out infinite 2.5s;
    }
    .orbiting-ring {
      transform-origin: 600px 200px;
      animation: orbitSlow 45s linear infinite;
    }
    .animated-dash {
      stroke-dasharray: 6, 12;
      animation: dashMove 15s linear infinite;
    }
    .beam {
      animation: beamSweep 4s ease-in-out infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
    }
  </style>

  <rect width="1200" height="400" rx="16" fill="url(#bgGradient)"/>

  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
    <line x1="1100" y1="0" x2="1100" y2="400"/>

    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
  </g>

  <circle class="pulse-glow-1" cx="250" cy="180" r="220" fill="url(#glowCyan)" filter="url(#blurFilter)"/>
  <circle class="pulse-glow-2" cx="950" cy="220" r="240" fill="url(#glowPurple)" filter="url(#blurFilter)"/>
  <circle cx="600" cy="200" r="180" fill="url(#glowIndigo)" filter="url(#blurFilter)"/>

  <g class="orbiting-ring">
    <ellipse cx="600" cy="200" rx="440" ry="150" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.5" class="animated-dash"/>
    <ellipse cx="600" cy="200" rx="330" ry="115" fill="none" stroke="#818cf8" stroke-opacity="0.15" stroke-width="1"/>
    <circle cx="160" cy="200" r="4.5" fill="#38bdf8" opacity="0.85"/>
    <circle cx="1040" cy="200" r="4.5" fill="#c084fc" opacity="0.85"/>
  </g>

  <g class="floating-node-1">
    <line x1="140" y1="130" x2="220" y2="210" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>
    <line x1="220" y1="210" x2="170" y2="290" stroke="#818cf8" stroke-opacity="0.25" stroke-width="1.5"/>
    <circle cx="140" cy="130" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="140" y="135" font-size="14" text-anchor="middle" fill="#38bdf8">📚</text>
    <text x="140" y="165" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Outputs</text>

    <circle cx="220" cy="210" r="24" fill="#1e293b" stroke="#818cf8" stroke-width="2.5"/>
    <text x="220" y="216" font-size="18" text-anchor="middle" fill="#818cf8">🏛️</text>
    <text x="220" y="250" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">CRIS / RIM</text>

    <circle cx="170" cy="290" r="16" fill="#1e293b" stroke="#c084fc" stroke-width="2"/>
    <text x="170" y="295" font-size="13" text-anchor="middle" fill="#c084fc">👤</text>
    <text x="170" y="322" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Profiles</text>
  </g>

  <g class="floating-node-2">
    <line x1="1040" y1="120" x2="970" y2="200" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1.5"/>
    <line x1="970" y1="200" x2="1030" y2="280" stroke="#f472b6" stroke-opacity="0.25" stroke-width="1.5"/>
    <circle cx="1040" cy="120" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="1040" y="125" font-size="14" text-anchor="middle" fill="#38bdf8">💰</text>
    <text x="1040" y="155" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Grants</text>

    <circle cx="970" cy="200" r="24" fill="#1e293b" stroke="#c084fc" stroke-width="2.5"/>
    <text x="970" y="206" font-size="18" text-anchor="middle" fill="#c084fc">🌐</text>
    <text x="970" y="240" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">Repositories</text>

    <circle cx="1030" cy="280" r="17" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
    <text x="1030" y="285" font-size="13" text-anchor="middle" fill="#f472b6">🔓</text>
    <text x="1030" y="312" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Open Science</text>
  </g>

  <g class="floating-node-3">
    <rect x="430" y="65" width="340" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="450" cy="81" r="5" fill="#38bdf8" class="beam"/>
    <text x="605" y="86" class="badge-text" fill="#7dd3fc" text-anchor="middle">🔬 SCHOLARLY RESEARCH ECOSYSTEM</text>
  </g>

  <text x="600" y="165" class="title-text" font-size="44" fill="url(#textGrad)" text-anchor="middle">Awesome Research Management</text>
  <text x="600" y="212" class="subtitle-text" font-size="18" fill="#e2e8f0" text-anchor="middle">Curated CRIS, RIM, Institutional Repositories &amp; Academic Intelligence</text>

  <g transform="translate(230, 260)">
    <rect x="40" y="0" width="135" height="34" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="107" y="21" class="badge-text" fill="#bae6fd" text-anchor="middle">📊 CRIS / RIM</text>

    <rect x="190" y="0" width="170" height="34" rx="8" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="275" y="21" class="badge-text" fill="#c7d2fe" text-anchor="middle">🏛️ Repositories &amp; RDM</text>

    <rect x="375" y="0" width="165" height="34" rx="8" fill="#1e293b" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="457" y="21" class="badge-text" fill="#e9d5ff" text-anchor="middle">💼 Commercial SaaS</text>

    <rect x="555" y="0" width="150" height="34" rx="8" fill="#1e293b" stroke="#f472b6" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="630" y="21" class="badge-text" fill="#fbcfe8" text-anchor="middle">⭐ Open-Source Stack</text>
  </g>

  <rect x="1" y="1" width="1198" height="398" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="2" opacity="0.6"/>
</svg>